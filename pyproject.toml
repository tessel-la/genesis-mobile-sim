[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-mobile-sim"
version = "0.1.0"
description = "Portable Genesis mobile-robot simulation with ROS 2 SLAM and navigation"
requires-python = ">=3.10,<3.14"
dependencies = ["genesis-world==1.3.2", "PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/tessel-la/genesis-mobile-sim"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The ROS image exposes colcon-core through --system-site-packages; it requires setuptools<80.
[tool.uv]
constraint-dependencies = ["setuptools<80"]
